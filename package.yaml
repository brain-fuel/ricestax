name:                rices-tax
version:             0.4.0
license:             MIT
license-file:        LICENSE
author:              "brain-fuel"
maintainer:          "matthew.i.laine@gmail.com"
copyright:           "2026 brain-fuel"
synopsis:            The ledger of what a machine raised about a codebase and a person must decide
description:         Please see README.md

extra-source-files:
- README.md
- CHANGELOG.md

default-extensions:
- DeriveTraversable
- DeriveGeneric
- OverloadedStrings
- RankNTypes
- FlexibleContexts
- RecordWildCards
- LambdaCase
- TupleSections
- ScopedTypeVariables

dependencies:
- base >= 4.7 && < 5
- text
- containers

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

flags:
  mutation:
    description: Instrument the library for mutation testing with the sydtest-mutation plugin.
    manual: true
    default: false

library:
  source-dirs: src
  dependencies:
  - canon == 0.2.0
  - aeson
  - scientific
  - yaml
  - bytestring
  - cryptohash-sha256
  - directory
  - filepath
  - text
  - containers
  - time
  when:
  - condition: flag(mutation)
    ghc-options:
    - -fplugin=Test.Syd.Mutation.Plugin
    - -fplugin-opt=Test.Syd.Mutation.Plugin:--manifest=mutation-manifest
    dependencies:
    - sydtest-mutation-plugin
    - sydtest-mutation-runtime

tests:
  corpus:
    main:                Corpus.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - '"-with-rtsopts=-N -qg"'
    dependencies:
    - rices-tax
    - canon
    - sydtest
    - sydtest-mutation
    - QuickCheck
    - aeson
    - bytestring
    - containers
    - directory
    - filepath
    - process
    - text

executables:
  ricestax:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - '"-with-rtsopts=-N -qg"'
    dependencies:
    - rices-tax
    - canon
    - process
    - warp
    - wai
    - wai-extra
    - http-types
    - aeson
    - yaml
    - bytestring
    - directory
    - filepath
    - time
