name:                rices-tax
version:             0.1.0
license:             MIT
license-file:        LICENSE
author:              "brain-fuel"
maintainer:          "matthew.i.laine@gmail.com"
copyright:           "2026 brain-fuel"
synopsis:            The ledger of what a machine raised about a codebase and a person must decide
description:         Please see README.md

extra-source-files:
- README.md
- CHANGELOG.md

default-extensions:
- DeriveTraversable
- OverloadedStrings
- RankNTypes
- FlexibleContexts
- RecordWildCards
- LambdaCase
- TupleSections
- ScopedTypeVariables

dependencies:
- base >= 4.7 && < 5
- text
- containers

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - canon
