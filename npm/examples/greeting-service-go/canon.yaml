{
  "version": "0.1.0",
  "ignore": [
    ".ricestax",
    "node_modules",
    "target",
    "build",
    "dist",
    ".venv",
    "__pycache__"
  ],
  "languages": {
    "go": {
      "extensions": [
        ".go"
      ],
      "lexer": ".ricestax/grammars/golang/GoLexer.g4",
      "parser": ".ricestax/grammars/golang/GoParser.g4",
      "start": "sourceFile",
      "comments": {
        "line": "//",
        "blockOpen": "/*",
        "blockClose": "*/",
        "strings": [
          "\"",
          "`",
          "'"
        ]
      },
      "units": [
        {
          "rule": "functionDecl",
          "kind": "function",
          "name": {
            "token": "IDENTIFIER",
            "index": 1
          },
          "required": true
        },
        {
          "rule": "methodDecl",
          "kind": "method",
          "name": {
            "token": "IDENTIFIER",
            "index": 1,
            "direct": true
          },
          "required": true
        },
        {
          "rule": "typeDef",
          "kind": "type",
          "name": {
            "token": "IDENTIFIER",
            "index": 1
          },
          "required": true
        },
        {
          "rule": "aliasDecl",
          "kind": "type",
          "name": {
            "token": "IDENTIFIER",
            "index": 1
          },
          "required": true
        }
      ]
    },
    "calm": {
      "extensions": [
        ".calm.json"
      ],
      "grammar": ".ricestax/grammars/calm/Calm.g4",
      "start": "json"
    },
    "folio": {
      "extensions": [
        ".md"
      ],
      "lexer": ".ricestax/grammars/folio/FolioLexer.g4",
      "parser": ".ricestax/grammars/folio/FolioParser.g4",
      "start": "document",
      "embeds": {
        "go": {
          "language": "go",
          "comments": {
            "line": "//",
            "blockOpen": "/*",
            "blockClose": "*/",
            "strings": [
              "\"",
              "`",
              "'"
            ]
          },
          "width": 98,
          "doc": {
            "open": "/** ",
            "continue": " * ",
            "blank": " *",
            "banner": "// ",
            "markup": "javadoc"
          }
        },
        "calm": {
          "language": "calm",
          "comments": {},
          "width": 98,
          "doc": {
            "open": "",
            "continue": "",
            "blank": "",
            "banner": "",
            "markup": "none"
          }
        }
      }
    }
  },
  "runtime": {
    "name": "ricestax-catalog",
    "artefacts": ".mut/current",
    "package": ".",
    "tests": "src",
    "command": "ricestax mutate"
  },
  "kinds": {
    "mutant": {
      "unreviewed": "open",
      "logical-equivalency": "closed",
      "inadequate-testing": "work",
      "unnecessary-code": "work",
      "needs-research": "deferred"
    }
  }
}
