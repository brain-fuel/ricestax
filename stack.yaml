# canon is taken from its checkout beside this project rather than as a git dependency, because
# Stack clones a git dependency with its submodules and canon's lang_samples submodules point at
# commits their remotes do not serve, so the clone fails before anything builds.
#
# The sydtest-mutation family is pinned to the versions wavelet runs, so a run here and a run
# there are the same tester (DEC-own-tests-sydtest).
snapshot:
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/24/58.yaml

packages:
- .
- ../canon

extra-deps:
- grammatical-parsers-0.7.2.1
- sydtest-0.30.0.0
- opt-env-conf-0.15.0.3
- sydtest-mutation-0.1.0.1
- sydtest-mutation-driver-0.1.0.0
- sydtest-mutation-plugin-0.4.6.0
- sydtest-mutation-runtime-0.1.1.0
