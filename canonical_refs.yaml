  locator: canonical_decisions.yaml#DEC-site
REQ-video-embed:
  kind: requirement
  title: A video locator canon knows is embedded and any other is linked
  locator: canonical_decisions.yaml#DEC-site
REQ-site-deterministic:
  kind: requirement
  title: Two renders of one tree are one site
  locator: canonical_decisions.yaml#DEC-site
REQ-tangle-audited:
  kind: requirement
  title: audit fails on a tangled file that differs from its pages
  locator: canonical_decisions.yaml#DEC-tangling
REQ-mutant-lands-through-manifest:
  kind: requirement
  title: A line of a tangled file maps to the line of the page that produced it
  locator: canonical_decisions.yaml#DEC-tangling
REQ-mutation-rerun:
  kind: requirement
  title: The mutation's state travels the wire whole, and the run's command is a fact of the payload
  locator: canonical_decisions.yaml#DEC-mutation-rerun
REQ-line-diff:
  kind: requirement
  title: A mutant's diff marks only the lines that went and came, and keeps the shared lines as context
  locator: canonical_decisions.yaml#DEC-line-diff
REQ-marks:
  kind: requirement
  title: Marks travel beside every code line, tile it, and cut without losing their classes
  locator: canonical_decisions.yaml#DEC-highlighting

